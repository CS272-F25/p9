<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking | Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="styless/styles.css" rel="stylesheet"/>
    <script src="scripts/app.js"></script>
</head>
<body>
    <header class="bg-light">
        <nav class="navbar px-3 bg-transparent">
            <section class="container-fluid d-flex align-items-center">

                <a class="navbar-brand fw-bold text-success nav-section" href="index.html">Home</a>

                <p class="navbar-text fw-bold m-0 text-success text-center nav-section me-3">Cooking Portal</p>

                <ul class="navbar-nav d-flex flex-row justify-content-end gap-3 nav-section">
                    <li class="nav-item"><a class="nav-link fw-bold text-primary" href="recipe.html">Recipes</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-primary" href="cuisines.html">Cuisines</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-primary" href="planner.html">Meal Planner</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-primary" href="favorites.html">Favorites</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-primary" href="cart.html">Cart</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-primary" href="about.html">About</a></li>
                </ul>
            </section>
        </nav>
    </header>

    <main class="container py-4">
        <!-- Search Form -->
        <section aria-labelledby="search-heading" class="mb-4">
            <h1 id="search-heading" class="text-center mb-3">Search Recipes</h1>
            <form id="search-form" class="row g-2 justify-content-center">
                <div class="col-12 col-md-6">
                    <label for="search-input" class="visually-hidden">Search by meal name</label>
                    <input type="text" id="search-input" class="form-control" placeholder="Search by meal name (e.g., chicken, pasta)..." required>
                </div>
                <div class="col-12 col-md-2">
                    <button type="submit" class="btn btn-success w-100">Search</button>
                </div>
            </form>
        </section>

        <!-- Results Container -->
        <section aria-labelledby="results-heading">
            <h2 id="results-heading" class="visually-hidden">Search Results</h2>
            <div id="results" class="row g-4">
                <!-- Results will be populated by JavaScript -->
                <p class="text-center text-muted">Enter a search term to find recipes!</p>
            </div>
        </section>

        <!-- Recipe Detail Modal -->
        <div class="modal fade" id="recipeModal" tabindex="-1" aria-labelledby="recipeModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title" id="recipeModalLabel">Recipe Details</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="modal-body">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light text-center py-3">
        <section class="container d-flex justify-content-between align-items-center">
            <p class="mb-1">&copy; 2025</p>
            <p class="mb-1">LIS 472 Group 9</p>
            <a href="https://github.com/CS272-F25/p9" class="text-decoration-none">GitHub</a>
        </section>
    </footer>


</body>
</html>
